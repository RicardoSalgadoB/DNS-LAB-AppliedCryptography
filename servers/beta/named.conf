options {
    directory "/var/cache/bind";
    listen-on { 172.30.0.50; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-policy default;
};
zone "beta.signed" {
    type primary;
    file "/var/lib/bind/db.beta.signed";
    dnssec-policy default;
    inline-signing yes;
};