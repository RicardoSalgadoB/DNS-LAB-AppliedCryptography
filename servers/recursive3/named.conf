options {
    directory "/var/cache/bind";

    listen-on { 172.30.0.102; };
    listen-on-v6 { none; };

    recursion yes;

    allow-recursion {
        172.30.0.0/24; 
    };

    allow-query {
        172.30.0.0/24;
    };

    dnssec-validation yes;
};

trust-anchors {
    "." static-ds 40607 13 2 "EAAEB084C570E0A1AEB5219A5DFB96AFF27E3B351CEADB62A4D5418BAC564F22";
};

zone "." {
    type hint;
    file "/var/lib/bind/db.root.hints";
};