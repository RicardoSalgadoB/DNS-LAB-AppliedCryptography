options {
    directory "/var/cache/bind";

    listen-on { 172.30.0.40; };
    listen-on-v6 { none; };

    recursion no;

    allow-query { any; };

    dnssec-policy default;
};

zone "signed" {
    type primary;
    file "/var/lib/bind/db.signed";
    dnssec-policy default;
    inline-signing yes;
};